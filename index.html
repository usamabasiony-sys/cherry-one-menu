:root{--r:#c80826;--y:#ffd429;--k:#0d0d0d}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Tahoma,Arial,sans-serif;padding-bottom:82px}
header{position:sticky;top:0;z-index:15;background:#080808ed;border-bottom:1px solid #492a12;padding:10px 4%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:25px;color:#e41434}.brand small{display:block;color:#fff;letter-spacing:3px;font-size:10px}.phone{font-weight:bold}
main{max-width:1180px;margin:auto;padding:14px}.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid #b88b35;box-shadow:0 15px 45px #000}.hero img{width:100%;max-height:620px;object-fit:cover;display:block}.hero .cta{position:absolute;bottom:20px;right:20px;border:0;background:var(--r);color:#fff;padding:14px 22px;border-radius:16px;font-weight:900;font-size:18px;box-shadow:0 5px 20px #0009}

.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:30}.overlay.show{display:block}.panel{position:absolute;bottom:0;left:0;right:0;max-width:700px;margin:auto;background:#141414;border-radius:25px 25px 0 0;padding:18px;max-height:90vh;overflow:auto}.x{float:left;background:#333;color:#fff;border:0;border-radius:50%;width:35px;height:35px}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #333;padding:11px 0}.q button{border:0;background:#333;color:#fff;border-radius:8px;width:30px;height:30px}.total{font-size:24px;color:var(--y);font-weight:900;padding:15px 0}.field{width:100%;padding:11px;border-radius:11px;border:1px solid #444;background:#222;color:#fff;margin:5px 0}.pay{display:flex;gap:8px;margin:10px 0}.pay label{flex:1;background:#222;padding:12px;border-radius:12px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:12px;padding:12px;font-weight:900}.send{background:#16a84f;color:#fff}.receipt{background:#eee}.photo{display:none;position:fixed;inset:0;background:#000e;z-index:50;place-items:center;padding:18px}.photo.show{display:grid}.photo img{max-width:94vw;max-height:84vh;border-radius:22px}.foot{text-align:center;padding:35px 10px;color:#bbb}

function render(){grid.innerHTML=items.filter(x=>current==='الكل'||x.cat===current).map(x=>`<article class="card"><img class="food" src="${x.img}" loading="lazy" onerror="this.src=\'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22900%22 height=%22600%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23211%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22white%22 font-size=%2240%22 text-anchor=%22middle%22%3ECherry One%3C/text%3E%3C/svg%3E\'" referrerpolicy="no-referrer" onclick="zoom('${x.img}')"><div class="body"><div class="name">${x.name}</div><div class="price">${x.price} ريال</div><button class="add" onclick="add('${x.name}',${x.price})">+ أضف للسلة</button></div></article>`).join('')}
function filterCat(c,b){current=c;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function zoom(s){big.src=s;ph.classList.add('show')}function add(n,p){let x=cart.find(z=>z.name===n);x?x.q++:cart.push({name:n,price:p,q:1});save();openCart()}
function save(){localStorage.setItem('coCart',JSON.stringify(cart));cartUI()}function total(){return cart.reduce((a,x)=>a+x.price*x.q,0)}
function cartUI(){cnt.textContent=cart.reduce((a,x)=>a+x.q,0);sum.textContent=tot.textContent=total();rows.innerHTML=cart.map((x,i)=>`<div class="row"><div><b>${x.name}</b><br>${x.price*x.q} ريال</div><div class="q"><button onclick="chg(${i},-1)">−</button> ${x.q} <button onclick="chg(${i},1)">+</button></div></div>`).join('')||'السلة فارغة'}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save()}function openCart(){cartUI();ov.classList.add('show')}function pay(){return document.querySelector('input[name=p]:checked').value}
function orderType(){return document.querySelector('input[name=otype]:checked').value}
function toggleTable(){
 const t=orderType();
 tableNo.style.display=t==='طلب صالة'?'block':'none';
 deliveryFields.style.display=t==='توصيل'?'block':'none';
}
function saveOrder(){
 if(!cart.length)return null;
 const rec={id:order,createdAt:new Date().toISOString(),customer:customer.value||'',type:orderType(),
 table:orderType()==='طلب صالة'?(tableNo.value||''):'',
 phone:orderType()==='توصيل'?(custPhone.value||''):'',
 address:orderType()==='توصيل'?(address.value||''):'',
 map:orderType()==='توصيل'?(mapLink.value||''):'',
 payment:pay(),notes:notes.value||'',items:cart.map(x=>({...x})),total:total(),status:'جديد'};
 let orders=JSON.parse(localStorage.getItem('cherryOrders')||'[]');
 const ix=orders.findIndex(x=>x.id===rec.id); if(ix>=0) orders[ix]=rec; else orders.unshift(rec);
 localStorage.setItem('cherryOrders',JSON.stringify(orders)); return rec;
}
function send(){if(!cart.length)return alert('السلة فارغة');saveOrder();let ls=cart.map(x=>`• ${x.name} × ${x.q} = ${x.price*x.q} ريال`).join('\n');let m=`🍒 طلب كريز ون\nرقم الطلب: ${order}\n${customer.value?'العميل: '+customer.value+'\n':''}\n${ls}\n\nالإجمالي: ${total()} ريال\nنوع الطلب: ${orderType()}${orderType()==='طلب صالة'?' - طاولة '+(tableNo.value||'غير محدد'):''}${orderType()==='توصيل'?'\nجوال التوصيل: '+(custPhone.value||'غير محدد')+'\nالعنوان: '+(address.value||'غير محدد')+(mapLink.value?'\nالموقع: '+mapLink.value:''):''}\nالدفع: ${pay()}\nالملاحظات: ${notes.value||'لا يوجد'}\n📍 تبوك - شارع المتنبي`;window.open('https://wa.me/966541790077?text='+encodeURIComponent(m),'_blank')}
function printR(k){if(!cart.length)return alert('السلة فارغة');saveOrder();printArea.innerHTML=`<div dir="rtl" style="max-width:360px;margin:auto;text-align:center"><h2>🍒 كريز ون</h2><b>${k?'ريسيت تجهيز المطبخ':'ريسيت الحساب'}</b><p>رقم الطلب ${order}</p><p><b>${orderType()}</b>${orderType()==='طلب صالة'?' — طاولة '+(tableNo.value||'غير محدد'):''}</p>${orderType()==='توصيل'?`<p style="text-align:right">جوال: ${custPhone.value||'-'}<br>العنوان: ${address.value||'-'}${mapLink.value?'<br>الموقع: '+mapLink.value:''}</p>`:''}<hr>${cart.map(x=>`<p style="text-align:right">${x.name} × ${x.q}${k?'':' — '+(x.price*x.q)+' ريال'}</p>`).join('')}<hr>${k?'':`<h2>الإجمالي ${total()} ريال</h2><p>الدفع: ${pay()}</p>`}<p>ملاحظات: ${notes.value||'لا يوجد'}</p></div>`;window.print()}
function clearC(){cart=[];order='CO-'+Date.now().toString().slice(-6);save()}renderOffers();render();cartUI();toggleTable();
</script></body></html>
