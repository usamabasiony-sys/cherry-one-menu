<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cherry One Admin</title>
<style>
:root{--r:#c80826;--y:#ffd429}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Tahoma,Arial}
header{padding:16px 4%;background:#111;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.logo{font-size:24px;font-weight:900;color:#e41434}.wrap{max-width:1200px;margin:auto;padding:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#171717;border:1px solid #333;border-radius:16px;padding:14px}.stat b{display:block;font-size:25px;color:var(--y)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tools button,.tools select{padding:10px;border-radius:10px;border:1px solid #444;background:#1d1d1d;color:#fff}.orders{display:grid;gap:12px}.order{background:#171717;border:1px solid #333;border-radius:18px;padding:14px}.top{display:flex;justify-content:space-between;gap:8px}.id{font-weight:900;color:var(--y)}.status{border-radius:20px;padding:6px 10px;background:#333}.items{background:#101010;border-radius:12px;padding:10px;margin:10px 0}.item{display:flex;justify-content:space-between;border-bottom:1px dashed #333;padding:6px}.meta{color:#ccc;line-height:1.8}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.prep{background:#e89b19}.ready{background:#20a85a;color:white}.done{background:#555;color:white}.print{background:#eee}.empty{text-align:center;padding:50px;color:#aaa}
.login{position:fixed;inset:0;background:#080808;z-index:50;display:grid;place-items:center}.box{width:min(90%,360px);background:#171717;border:1px solid #444;border-radius:20px;padding:22px;text-align:center}.box input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff}.box button{width:100%;padding:12px;background:var(--r);color:#fff;border:0;border-radius:10px;font-weight:900}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
@media print{header,.stats,.tools,.actions{display:none!important}.order{border:0}.order:not(.printing){display:none}}
</style></head><body>
<div class="login" id="login"><div class="box"><div class="logo">🍒 كريز ون</div><h2>لوحة الإدارة</h2><input id="pin" type="password" inputmode="numeric" placeholder="رمز الدخول"><button onclick="enter()">دخول</button><p style="color:#999;font-size:12px">صفحة الإدارة منفصلة وغير ظاهرة في منيو العميل.</p></div></div>
<header><div class="logo">🍒 CHERRY ONE ADMIN</div><div id="clock"></div></header><main class="wrap">
<div class="stats"><div class="stat">الطلبات<b id="sOrders">0</b></div><div class="stat">جديد<b id="sNew">0</b></div><div class="stat">جاري التجهيز<b id="sPrep">0</b></div><div class="stat">الإجمالي<b id="sTotal">0</b><small> ريال</small></div></div>
<div class="tools"><button onclick="render()">↻ تحديث</button><select id="filter" onchange="render()"><option>الكل</option><option>جديد</option><option>جاري التجهيز</option><option>جاهز</option><option>تم التسليم</option></select><button onclick="clearDone()">حذف الطلبات المسلّمة</button></div>
<div class="orders" id="orders"></div></main>
<script>
const ADMIN_PIN='2026';
function enter(){if(pin.value===ADMIN_PIN){login.style.display='none';sessionStorage.setItem('coAdmin','1');render()}else alert('رمز الدخول غير صحيح')}
if(sessionStorage.getItem('coAdmin')==='1')login.style.display='none';
function getOrders(){return JSON.parse(localStorage.getItem('cherryOrders')||'[]')}
function save(o){localStorage.setItem('cherryOrders',JSON.stringify(o));render()}
function setStatus(id,s){let o=getOrders();let x=o.find(a=>a.id===id);if(x)x.status=s;save(o)}
function render(){let all=getOrders();sOrders.textContent=all.length;sNew.textContent=all.filter(x=>x.status==='جديد').length;sPrep.textContent=all.filter(x=>x.status==='جاري التجهيز').length;sTotal.textContent=all.reduce((a,x)=>a+Number(x.total||0),0).toFixed(2);let f=filter.value;let list=f==='الكل'?all:all.filter(x=>x.status===f);orders.innerHTML=list.length?list.map(x=>`<article class="order" id="${x.id}"><div class="top"><div><span class="id">${x.id}</span><br><small>${new Date(x.createdAt).toLocaleString('ar-SA')}</small></div><span class="status">${x.status}</span></div><div class="meta"><b>${x.type}</b>${x.table?' · طاولة '+x.table:''}${x.customer?'<br>العميل: '+x.customer:''}${x.phone?'<br>الجوال: '+x.phone:''}${x.address?'<br>العنوان: '+x.address:''}<br>الدفع: ${x.payment}</div><div class="items">${x.items.map(i=>`<div class="item"><span>${i.name} × ${i.q}</span><b>${i.price*i.q} ريال</b></div>`).join('')}</div><b style="color:#ffd429">الإجمالي: ${x.total} ريال</b><p>ملاحظات: ${x.notes||'لا يوجد'}</p><div class="actions"><button class="prep" onclick="setStatus('${x.id}','جاري التجهيز')">جاري التجهيز</button><button class="ready" onclick="setStatus('${x.id}','جاهز')">جاهز</button><button class="done" onclick="setStatus('${x.id}','تم التسليم')">تم التسليم</button><button class="print" onclick="printOne('${x.id}')">طباعة</button></div></article>`).join(''):'<div class="empty">لا توجد طلبات في هذا القسم</div>'}
function printOne(id){document.querySelectorAll('.order').forEach(x=>x.classList.toggle('printing',x.id===id));window.print();document.querySelectorAll('.order').forEach(x=>x.classList.remove('printing'))}
function clearDone(){if(confirm('حذف الطلبات التي تم تسليمها؟'))save(getOrders().filter(x=>x.status!=='تم التسليم'))}
setInterval(()=>clock.textContent=new Date().toLocaleTimeString('ar-SA'),1000);render();
</script></body></html>
